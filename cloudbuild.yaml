steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/breast-cancer-screener:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/breast-cancer-screener:latest'
      - '.'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/breast-cancer-screener:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/breast-cancer-screener:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy'
    args:
      - run
      - services
      - update
      - breast-cancer-screener
      - --image=gcr.io/$PROJECT_ID/breast-cancer-screener:$SHORT_SHA
      - --platform=managed
      - --region=us-central1
      - --memory=2Gi
      - --cpu=2
      - --timeout=540
      - --max-instances=10
      - --no-allow-unauthenticated
      - --startup-probe-initial-delay=60
      - --startup-probe-timeout=60
      - --startup-probe-period=240
      - --startup-probe-failure-threshold=3
    env:
      - 'CLOUDSDK_RUN_REGION=us-central1'
      - 'CLOUDSDK_COMPUTE_REGION=us-central1'

images:
  - 'gcr.io/$PROJECT_ID/breast-cancer-screener:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/breast-cancer-screener:latest'

timeout: 3600s
